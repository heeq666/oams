{% extends "base.html" %}
{% block title %}登录 · Workhub{% endblock %}
{% block content %}
<h1>登录</h1>
<p class="sub">粘贴管理员发给你的会话令牌进入。令牌等同密码，只私发本人，别转发到群里。</p>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="card" style="max-width:520px">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field" style="margin-bottom:12px">
    <label for="token">会话令牌</label>
    <input id="token" name="token" type="password" autocomplete="off" required style="width:100%"
           placeholder="粘贴管理员给你的令牌">
  </div>
  <button type="submit">进入</button>
</form>
<p class="sub" style="margin-top:14px">还没有令牌？找系统管理员签发一个，有效期默认 8 小时，到期后需要重新签发。</p>
{% endblock %}
