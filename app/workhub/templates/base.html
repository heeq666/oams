<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Workhub{% endblock %}</title>
<script src="/static/vendor/htmx.min.js" defer></script>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1d2126;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2f3437;
    --blocked: #c0392b;
    --decision: #b7791f;
    --done: #2f855a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  header.topbar { display: flex; align-items: center; gap: 24px; padding: 12px 24px;
                  background: var(--accent); color: #fff; }
  header.topbar a { color: #fff; text-decoration: none; opacity: .85; }
  header.topbar a:hover { opacity: 1; }
  header.topbar .brand { font-weight: 600; letter-spacing: .02em; }
  header.topbar nav { display: flex; gap: 18px; flex: 1; }
  header.topbar .who { display: flex; align-items: center; gap: 12px; font-size: 14px; opacity: .9; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 24px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 12px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .metric { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .metric .n { font-size: 24px; font-weight: 600; }
  .metric .k { color: var(--muted); font-size: 12px; }
  .metric.alert .n { color: var(--blocked); }
  .metric.warn .n { color: var(--decision); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items > li { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--line);
                  border-radius: 6px; padding: 12px 14px; margin-bottom: 8px; }
  ul.items > li.blocked { border-left-color: var(--blocked); }
  ul.items > li.planned { border-left-color: #cbd5e0; }
  .row1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .title { font-weight: 600; }
  /* Position is metadata, not a state -- grey text at the row end instead of a
     badge that competes with status colours. Warnings keep one accent each. */
  .row1 .pos { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .row1 .pos .vac { color: var(--blocked); font-style: normal; margin-left: 6px; }
  .badge { font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line);
           color: var(--muted); background: #fafbfc; }
  .badge.blocked { color: #fff; background: var(--blocked); border-color: var(--blocked); }
  .badge.decision { color: #fff; background: var(--decision); border-color: var(--decision); }
  .badge.agent { color: #fff; background: #4c51bf; border-color: #4c51bf; }
  .badge.human { color: #fff; background: #4a5568; border-color: #4a5568; }
  .badge.vacant { color: var(--blocked); border-color: var(--blocked); }
  .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .note { margin-top: 6px; font-size: 14px; }
  .evidence { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  /* Keyboard users get to see where they are; WCAG 2.4.7. */
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { background: #fafbfc; color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  form.inline { display: inline; }
  button, .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
                 padding: 6px 14px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.link { background: none; color: var(--muted); padding: 0; }
  input, select, textarea { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                            font-size: 14px; background: #fff; color: var(--ink); }
  label { font-size: 13px; color: var(--muted); }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .flash { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; background: #edf7ee; color: var(--done); }
  .flash.error { background: #fdecea; color: var(--blocked); }
  .pagehead { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .pagehead h1 { margin: 0; }
  /* Department navigation is a segmented control on purpose: it navigates space,
     while the chip row below it filters the list. Same page, two silhouettes. */
  .orgnav { display: inline-flex; border: 1px solid var(--line); border-radius: 8px;
            background: #fff; overflow: hidden; }
  .orgnav a { padding: 7px 16px; font-size: 14px; color: var(--muted); text-decoration: none; }
  .orgnav a + a { border-left: 1px solid var(--line); }
  .orgnav a.on { background: var(--accent); color: #fff; }
  .orgnav a:hover:not(.on) { background: #fafbfc; color: var(--ink); }
  /* The AI-dictation scoreboard: one horizontal human/agent split, not a metric card. */
  .channel-scorecard { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
                       padding: 12px 14px; margin-bottom: 16px; }
  .channel-scorecard .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .channel-scorecard .head .k { color: var(--muted); font-size: 12px; }
  .channel-scorecard .head .n { font-size: 20px; font-weight: 600; }
  .channel-scorecard .split { display: flex; height: 8px; border-radius: 4px; overflow: hidden;
                              background: var(--line); margin: 8px 0 6px; }
  .channel-scorecard .split .agent { background: #4c51bf; }
  .channel-scorecard .split .human { background: #4a5568; }
  .channel-scorecard .legend { display: flex; gap: 16px; color: var(--muted); font-size: 12px; }
  .channel-scorecard .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tabs a { padding: 7px 14px; border-radius: 16px; border: 1px solid var(--line);
            background: #fff; color: var(--ink); text-decoration: none; font-size: 14px; }
  .tabs a.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabs a .cnt { margin-left: 6px; font-size: 12px; opacity: .65; }
  /* Layers are text chips: the department selector above is navigation, stages
     below are a flow -- both get a different silhouette, so the three rows never
     read as the same kind of control. */
  .tabs.layers { gap: 2px; margin-bottom: 12px; }
  .tabs.layers a { border: none; background: transparent; color: var(--muted);
                   padding: 6px 12px; border-radius: 8px; }
  .tabs.layers a:hover { background: #eceef0; color: var(--ink); }
  .tabs.layers a.on { background: var(--accent); color: #fff; }
  .tabs.layers a .cnt { font-weight: 600; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .flowstrip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
               background: #fafbfc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .flowstrip .arrow, .flowstrip .fork { color: var(--muted); font-size: 13px; }
  .flowstrip .fork { margin-left: 10px; }
  .flowstrip .stage { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 14px;
                      border: 1px solid var(--line); border-radius: 16px; background: #fff;
                      color: var(--ink); font-size: 14px; text-decoration: none; }
  .flowstrip a.stage:hover { border-color: var(--accent); }
  .flowstrip .stage .cnt { font-size: 13px; font-weight: 600; opacity: .75; }
  .flowstrip .stage.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .flowstrip .stage.on .cnt { opacity: .9; }
  .flowstrip .stage.blocked.on { background: var(--blocked); border-color: var(--blocked); }
  .flowstrip .stage.terminal { color: var(--muted); background: #f2f8f4; border-color: #cfe3d6; cursor: default; }
  .flowstrip .stage.terminal .cnt { color: var(--done); }
  /* A zero is not good news worth highlighting -- fade the terminal count when
     nothing has finished, keep the colour for when there is something to show. */
  .flowstrip .stage.terminal.zero { opacity: .55; }
  .flowstrip .stage.terminal.zero .cnt { color: var(--muted); }
  .flowstrip .clear { margin-left: auto; font-size: 13px; color: var(--muted); text-decoration: none; align-self: center; padding: 7px 0; }
  .flowstrip .clear:hover { color: var(--ink); text-decoration: underline; }
  .office-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 1000px) { .office-layout { grid-template-columns: minmax(0, 1fr); } }
  .floor > svg.plan { width: 100%; height: auto; background: #fff;
                      border: 1px solid var(--line); border-radius: 12px; display: block; }
  /* One colour per room, answering one question: does this need me today. */
  .zone { fill: #eef2ef; stroke: #cfe3d6; stroke-width: 2; }
  .zone.warn { fill: #fdf6e8; stroke: #e8cf94; }
  .zone.alert { fill: #fdf1ef; stroke: #eeb2a8; }
  .zone.uncalibrated { fill: #f7f8f9; stroke: #b8bec4; }
  .plan a:hover .zone { stroke: var(--accent); }
  .plan a:focus-visible .zone { stroke: var(--accent); stroke-width: 3; }
  .zone-name { font-size: 28px; font-weight: 600; fill: var(--ink); }
  .zone-num { font-size: 48px; font-weight: 600; fill: var(--ink); }
  .zone-numlabel { font-size: 20px; fill: var(--muted); }
  .zone-flag { font-size: 22px; fill: var(--blocked); font-weight: 500; }
  .zone-calib { font-size: 18px; fill: #98a0a8; }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .zoom-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .zoom-head h2 { margin: 0; }
  .badge.heat.ok { color: var(--done); border-color: #cfe3d6; background: #f2f8f4; }
  .badge.heat.warn { color: var(--decision); border-color: #e8cf94; background: #fdf6e8; }
  .badge.heat.alert { color: #fff; background: var(--blocked); border-color: var(--blocked); }
  svg.room { width: 100%; height: auto; background: #fbfcfb; border: 1px solid var(--line);
             border-radius: 10px; margin-bottom: 12px; }
  .desk rect { fill: #fff; stroke: #d3d9de; stroke-width: 2; }
  .desk.warn rect { fill: #fdf6e8; stroke: #e8cf94; }
  .desk.alert rect { fill: #fdf1ef; stroke: #eeb2a8; }
  .desk.vacant rect { fill: #f6f7f8; stroke: #d9dde1; stroke-dasharray: 10 8; }
  .desk-name { font-size: 26px; font-weight: 600; fill: var(--ink); }
  .desk-num { font-size: 22px; fill: var(--muted); }
  .desk-flag { font-size: 20px; fill: var(--blocked); font-weight: 500; }
  /* Floor plan editor: the canvas is a view, the data attributes are the truth.
     Handles stay invisible until hover or selection so the plan reads as a plan
     first and as a set of controls second. */
  .crumbs { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; }
  .crumbs a { color: var(--muted); text-decoration: none; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; }
  .crumbs [aria-current] { font-weight: 600; }
  .editor { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .editor { grid-template-columns: minmax(0, 1fr); } }
  .editor-canvas svg { width: 100%; height: auto; background: #fff;
                       border: 1px solid var(--line); border-radius: 12px; display: block; }
  .floor-bg { fill: #fbfcfd; }
  .floor-hint { font-size: 22px; fill: var(--muted); }
  .editor .item { cursor: grab; outline: none; }
  .editor .item rect { fill: #eef2ef; stroke: #cbd5cf; stroke-width: 2; }
  .editor .item.uncalibrated rect { fill: #f7f8f9; stroke: #b8bec4; }
  .editor .item.selected rect, .editor .item:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
  .editor .item .handle { fill: #fff; stroke: var(--accent); stroke-width: 3; opacity: 0; cursor: nwse-resize; }
  .editor .item:hover .handle, .editor .item.selected .handle,
  .editor .item:focus-visible .handle { opacity: 1; }
  .inspector { position: sticky; top: 16px; }
  .inspector h2 { font-size: 15px; }
  .inspector .field { display: block; margin-bottom: 10px; }
  .inspector .field.check { display: flex; align-items: center; gap: 6px; }
  .btn { display: inline-block; padding: 7px 12px; border-radius: 8px; background: var(--accent);
         color: #fff; text-decoration: none; font-size: 14px; }
  .link.danger { color: var(--blocked); }
  .seatlist { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 8px;
              grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .seatlist li { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .seatlist li.empty { display: block; color: var(--muted); background: transparent; border-style: dashed; }
  .stack { margin-bottom: 20px; }
  .form-row .check { flex-direction: row; align-items: center; gap: 6px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  .flowstrip .clear:hover { color: var(--ink); text-decoration: underline; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/board">Workhub</a>
  <nav>
    <a href="/board">看板</a>
    <a href="/office">办公室</a>
    <a href="/admin/work-items">工作项</a>
    <a href="/admin/positions">岗位</a>
    <a href="/admin/spaces">布置</a>
    <a href="/admin/audit">审计</a>
  </nav>
  <div class="who">
    {% if member %}
      <span>{{ member.display_name }}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="link" style="color:#fff;opacity:.85">退出</button>
      </form>
    {% else %}
      <a href="/login">登录</a>
    {% endif %}
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% block tail %}{% endblock %}
</body>
</html>
