[project]
name = "company-os"
version = "0.1.0"
description = "Company workforce identity, positions, assignments, and permissions service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20",
  "pyyaml>=6,<7",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[project.scripts]
workhub = "workhub.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
workhub = [
  "migrations/*.sql",
  "templates/*.html",
  "templates/**/*.html",
  "static/vendor/*.js",
  "static/*.js",
  "static/*.css",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs a live PostgreSQL (skipped when unreachable)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
